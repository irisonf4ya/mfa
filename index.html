<style>

body{
    margin:0;
    font-family:Segoe UI,sans-serif;
    background:url('5F7A0603.JPG') center center/cover no-repeat fixed;
}

.overlay{
    min-height:100vh;
    background:rgba(0,0,0,0.65);
}

.header{
    text-align:center;
    padding:40px;
    color:white;
}

.header h1{
    font-size:70px;
    margin:0;
}

.header p{
    font-size:28px;
}

.cards{
    width:90%;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:20px;
    padding:30px;
}

.card{
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(8px);
    border-radius:20px;
    min-height:180px;
    text-decoration:none;
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    transition:0.3s;
}

.card:hover{
    transform:scale(1.05);
    background:rgba(0,120,215,0.8);
}

.icon{
    font-size:60px;
}

.card h2{
    margin-top:10px;
}

</style>

</head>

<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<title>Мэдээллийн самбар</title>

<style>
body{
    margin:0;
    font-family:Segoe UI;
    background:linear-gradient(135deg,#4facfe,#00f2fe);
}

.header{
    text-align:center;
    color:white;
    padding:40px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    padding:20px;
}

.card{
    background:white;
    border-radius:20px;
    padding:30px;
    text-align:center;
    text-decoration:none;
    color:black;
    transition:0.3s;
    box-shadow:0 5px 15px rgba(0,0,0,0.15);
}

.card:hover{
    transform:translateY(-10px);
}

.icon{
    font-size:60px;
}
</style>
</head>

<body>

<div class="header">
    <h1>📢 Мэдээллийн самбар</h1>
    <p>Гадаад харилцааны яам</p>
</div>

<div class="cards">

<a class="card" href="pdfss="icon">🛡️</div>
<h2>Аюулгүй байдал</h2>
</a>

pdf/order.pdf
<div class="icon">📄</div>
<h2>Тушаал</h2>
</a>

pdf/manual.pdf
<div class="icon">💻</div>
<h2>Заавар</h2>
</a>

pdf/news.pdf
<div class="icon">📢</div>
<h2>Мэдээ</h2>
</a>

</div>

</body>
</html>

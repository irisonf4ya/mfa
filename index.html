<style>

body{
    margin:0;
    font-family:Segoe UI,sans-serif;
    background:url('5F7A0603.JPG') center center/cover no-repeat fixed;
}

.overlay{
    min-height:100vh;
    background:rgba(0,0,0,0.65);
}

.logo{
    position:fixed;
    top:20px;
    right:20px;
    width:100px;
    height:auto;
    z-index:9999;
}

.header{
    text-align:center;
    padding:40px;
    color:white;
}

.header h1{
    font-size:70px;
    margin:0;
}

.header p{
    font-size:40px;
    margin-top:20px;
}

.cards{
    width:90%;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:30px;
    padding:30px;
}

.card{
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(8px);
    border-radius:20px;
    min-height:250px;

    text-decoration:none;
    color:white;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;
    padding:20px;

    transition:0.3s;
}

.card:hover{
    transform:scale(1.05);
    background:rgba(0,120,215,0.8);
}

.icon{
    font-size:60px;
}

.card h2{
    margin-top:15px;
    line-height:1.4;
    text-align:center;
}

</style>

</head>

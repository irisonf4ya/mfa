<title>Мэдээллийн самбар</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, sans-serif;
}

body{
    background-image: url('5F7A0603.JPG');
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
}

.overlay{
    min-height:100vh;
    background:rgba(0,0,0,0.5);
}

.header{
    text-align:center;
    color:white;
    padding:50px 20px;
}

.header h1{
    font-size:50px;
}

.header p{
    font-size:20px;
    margin-top:10px;
}

.cards{
    width:90%;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
    padding-bottom:50px;
}

.card{
    text-decoration:none;
    color:white;
    border-radius:20px;
    padding:30px;
    transition:0.3s;
    backdrop-filter:blur(10px);
}

.card:hover{
    transform:translateY(-10px);
}

.red{
    background:rgba(255,0,0,0.75);
}

.blue{
    background:rgba(0,123,255,0.75);
}

.green{
    background:rgba(40,167,69,0.75);
}

.orange{
    background:rgba(255,140,0,0.75);
}

.card h2{
    margin-top:15px;
}

.icon{
    font-size:60px;
}

.footer{
    text-align:center;
    color:white;
    padding:20px;
}

</style>
</head>
